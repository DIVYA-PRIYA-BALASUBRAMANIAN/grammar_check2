spring.application.name=doctor-vet-server
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/zenvevet?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Vasanth@zenve
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CORS & Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Jackson Deserialization Robustness
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ==============================================================================
# Mail & SMTP Configuration (Zenve Vet Automated Emails)
# ==============================================================================
spring.mail.host=${SPRING_MAIL_HOST:mail.zenvevet.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:no-reply@zenvevet.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:noreply@zenve123}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Zenve Vet Custom Mail Settings
app.mail.from=no-reply@zenvevet.com
app.mail.sender-name=Zenve Vet
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.app-url=${APP_URL:http://localhost:5173}
