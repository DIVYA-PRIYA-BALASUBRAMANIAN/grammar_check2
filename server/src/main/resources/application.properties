spring.application.name=doctor-vet-server
server.port=${SERVER_PORT:8080}

# ==============================================================================
# High-Throughput Embedded Tomcat Configuration (Tuned for 300,000 Users)
# ==============================================================================
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:400}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE:50}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:10000}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:1000}
server.tomcat.connection-timeout=20000

# HTTP Response Compression (Save 75%+ bandwidth across 3 Lakh users)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# ==============================================================================
# MySQL Database & High-Concurrency HikariCP Pool
# ==============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zenvevet}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&useLocalSessionState=true&rewriteBatchedStatements=true&cacheResultSetMetadata=true&cacheServerConfiguration=true&elideSetAutoCommits=true&maintainTimeStats=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Vasanth@zenve}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:50}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:15}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.pool-name=ZenveVetHikariPool

# ==============================================================================
# Hibernate / JPA Performance Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# ==============================================================================
# Distributed Caching (Stories, Feed, Doctor Profiles)
# ==============================================================================
spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.cache.cache-names=stories,doctors,feed,reels

# ==============================================================================
# Healthcheck & Actuator Monitoring for Load Balancer Liveness Probes
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# ==============================================================================
# CORS & Upload Limits
# ==============================================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Jackson Deserialization Robustness
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# APITXT OTP Configuration (Read from environment variables)
apitxt.api-key=${APITXT_API_KEY:}
apitxt.api-url=${APITXT_API_URL:}

# ==============================================================================
# Mail & SMTP Configuration (Zenve Vet Automated Emails)
# ==============================================================================
spring.mail.host=${SPRING_MAIL_HOST:mail.zenvevet.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:no-reply@zenvevet.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:noreply@zenve123}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Zenve Vet Custom Mail Settings
app.mail.from=no-reply@zenvevet.com
app.mail.sender-name=Zenve Vet
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.app-url=${APP_URL:http://localhost:5173}
