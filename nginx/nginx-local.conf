# ==============================================================================
# Zenve Vet Local Windows/Mac/Linux Load Balancer Configuration
# For testing local multi-instance Spring Boot balancing (8080, 8081, 8082)
# ==============================================================================

events {
    worker_connections 2048;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream backend pool routing across local Spring Boot instances
    upstream local_zenve_backend {
        least_conn;
        server 127.0.0.1:8080 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8081 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8082 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 8000;
        server_name localhost;

        # WebSocket endpoint
        location /ws/ {
            proxy_pass http://local_zenve_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # API Endpoints
        location /api/ {
            proxy_pass http://local_zenve_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Static Uploads Offloading
        location /uploads/ {
            proxy_pass http://local_zenve_backend;
            proxy_set_header Host $host;
        }

        # Frontend Dev Server or Static Build
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
    }
}
