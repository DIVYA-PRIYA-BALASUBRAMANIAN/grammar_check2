# ==============================================================================
# Zenve Vet Production Nginx Load Balancer Configuration
# Engineered for High Throughput (300,000+ Users / 15,000+ Requests/Sec)
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High-Performance File Transfer
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Upload size limits for clinical videos and high-res imagery
    client_max_body_size 60M;
    client_body_buffer_size 1M;

    # Logging format optimized for high-volume analysis
    log_format load_balanced '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" "$upstream_addr" '
                             'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log load_balanced buffer=64k flush=5m;
    error_log /var/log/nginx/error.log warn;

    # Gzip Dynamic Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Open File Cache for static files and uploads
    open_file_cache max=50000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ==============================================================================
    # Rate Limiting & Anti-Abuse Protection
    # ==============================================================================
    limit_req_zone $binary_remote_addr zone=general_api:20m rate=120r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn:20m;

    # Map for WebSocket Upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ==============================================================================
    # Upstream Spring Boot Server Cluster (Horizontal Load Balancing Pool)
    # Uses 'least_conn' to route requests to the least loaded JVM replica
    # ==============================================================================
    upstream zenve_vet_backend {
        least_conn;
        server backend-1:8080 max_fails=3 fail_timeout=10s;
        server backend-2:8080 max_fails=3 fail_timeout=10s;
        server backend-3:8080 max_fails=3 fail_timeout=10s;
        server backend-4:8080 max_fails=3 fail_timeout=10s backup;
        
        # Keepalive persistent socket connections to backend pool
        keepalive 128;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Connection Limit per IP
        limit_conn addr_conn 100;

        # ----------------------------------------------------------------------
        # 1. Direct Static Uploads Offloading (Zero JVM Overhead!)
        # Bypasses Tomcat completely to serve files via Nginx kernel sendfile
        # ----------------------------------------------------------------------
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform, max-age=2592000";
            add_header Access-Control-Allow-Origin "*";
            try_files $uri @backend_fallback;
        }

        # Fallback to backend if upload is in a custom or mounted directory
        location @backend_fallback {
            proxy_pass http://zenve_vet_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------------------------
        # 2. WebSocket Real-Time Clinical Chat & Peer Discussion Gateway
        # ----------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://zenve_vet_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ----------------------------------------------------------------------
        # 3. Authentication & Sensitive Endpoints (Strict Rate Limiting)
        # ----------------------------------------------------------------------
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://zenve_vet_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 4. REST API Gateway (Load Balanced across Spring Boot Cluster)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=general_api burst=50 nodelay;
            proxy_pass http://zenve_vet_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Upstream timeout configuration
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # High-concurrency proxy buffers
            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 512k;
        }

        # ----------------------------------------------------------------------
        # 5. Actuator Health Probe for External Monitoring & AWS/K8s Load Balancers
        # ----------------------------------------------------------------------
        location /actuator/health {
            proxy_pass http://zenve_vet_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # 6. React Single Page Application (SPA) Frontend
        # ----------------------------------------------------------------------
        location / {
            root /var/www/client/dist;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Cache static assets (CSS, JS, Fonts, Images)
            location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpg|jpeg|gif|ico|webp|svg)$ {
                expires 7d;
                add_header Cache-Control "public, max-age=604800, immutable";
                access_log off;
            }
        }
    }
}
